<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Token Mining</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #0c0c0e;
            --card-bg: #16161a;
            --card-border: rgba(255, 255, 255, 0.08);
            --gold-primary: #f3ba2f;
            --gold-gradient: linear-gradient(135deg, #f3ba2f 0%, #d49811 100%);
            --text-main: #ffffff;
            --text-secondary: #8b8b93;
            --green-accent: #00ff88;
            --ton-blue: #0098ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(243, 186, 47, 0.18) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            z-index: 1;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            min-height: 48px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--gold-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(243, 186, 47, 0.3);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username {
            font-weight: 600;
            font-size: 15px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .assets-card {
            background: linear-gradient(145deg, rgba(22, 22, 26, 0.9), rgba(30, 30, 38, 0.7));
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px;
            text-align: center;
            margin-bottom: 15px;
            backdrop-filter: blur(12px);
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .assets-title {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .assets-amount {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }

        .assets-amount span {
            color: var(--gold-primary);
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.2);
        }

        .wallet-breakdown {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--card-border);
            padding-top: 12px;
        }

        .wallet-breakdown b {
            color: var(--text-main);
        }

        .mining-display {
            text-align: center;
            margin-bottom: 5px;
            height: 30px;
        }

        .increment-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--green-accent);
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
            transition: transform 0.1s;
        }

        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 25px 0;
            position: relative;
        }

        .coin {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffe680 0%, #f3ba2f 55%, #9c7305 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(243, 186, 47, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.6);
            border: 4px solid #fff2b2;
            position: relative;
            cursor: pointer;
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .coin:active {
            transform: scale(0.92);
        }

        .floating-number {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: var(--green-accent);
            pointer-events: none;
            animation: floatToAssets 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 50;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        @keyframes floatToAssets {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-240px) scale(0.7);
            }
        }

        .claim-btn {
            width: 100%;
            background: var(--gold-gradient);
            color: #111;
            font-size: 17px;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(243, 186, 47, 0.3);
            transition: all 0.2s;
            margin-top: auto;
            letter-spacing: 0.5px;
        }

        .claim-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
            box-shadow: 0 2px 10px rgba(243, 186, 47, 0.2);
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(18, 18, 22, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .nav-item.active {
            color: var(--gold-primary);
            transform: translateY(-2px);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        .view-content {
            display: none;
            flex: 1;
            flex-direction: column;
            animation: fadeIn 0.25s ease-in-out;
        }

        .view-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .placeholder-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 12px;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .placeholder-card p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .placeholder-card b {
            color: var(--gold-primary);
        }

        .action-chip {
            background: rgba(0, 152, 234, 0.15);
            color: var(--ton-blue);
            border: 1px solid rgba(0, 152, 234, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .action-chip:active {
            background: rgba(0, 152, 234, 0.3);
        }

        #ton-connect-button {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
